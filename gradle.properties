# The dev machine has 11 GB of RAM; the CI macOS runner has 7 GB. The Kotlin/Native
# compiler of the ported UI needs a few GB in its daemon, so the maxima are generous:
# -Xmx is a ceiling, not a reservation.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx4g
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
